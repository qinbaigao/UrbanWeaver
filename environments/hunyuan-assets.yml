name: cityg-assets
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.4
  - torchvision
  - pytorch-cuda=12.1
  # Required to compile Hunyuan3D-Paint's custom rasterizer extension.
  - cuda-nvcc=12.1
  - pip
  - pip:
      - accelerate
      - diffusers==0.30.2
      - einops
      - fastapi
      - ninja
      - numpy
      - omegaconf
      - onnxruntime
      - opencv-python
      - pillow
      - pybind11
      - pygltflib
      - pymeshlab
      - rembg
      - sentencepiece
      - transformers==4.48.3
      - tokenizers==0.21.4
      - trimesh
      - uvicorn
      - xatlas
