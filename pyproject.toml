[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cityg"
version = "0.2.0"
description = "A hierarchical agent framework for simulation-ready city generation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = []

classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
geospatial = ["shapely>=2.1,<3"]
robot = ["numpy>=1.24,<3", "scipy>=1.12,<2"]

[project.scripts]
cityg = "cityg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cityg = ["viewer_static/*", "viewer_static/**/*", "geometry/pedestrian_tree_profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
